name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A branch push and its PR would otherwise run the same commit twice.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install test-only dependencies
        # opentelemetry-proto is TEST-ONLY and never ships. It is what pins our
        # hand-rolled OTLP encoder to the real wire format.
        run: python -m pip install --upgrade pip 'pytest>=7.0' 'opentelemetry-proto==1.43.0'
      - run: python -m pytest -q

  windows:
    # The fakes in the suite exercise the LOGIC of every Windows branch on
    # Linux. This job is the only thing that executes it on Windows: ctypes
    # reaching kernel32, msvcrt byte-range locks, detached process creation,
    # and hook.sh resolving an interpreter under Git Bash.
    name: tests (windows, py3.12)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test-only dependencies
        run: python -m pip install --upgrade pip 'pytest>=7.0' 'opentelemetry-proto==1.43.0'
      - run: python -m pytest -q -rs

  runtime-floor:
    # The shipped plugin runs under whatever `python3` a user already has, via
    # a shebang. 3.9 is the floor we support, and opentelemetry-proto needs
    # 3.10+, so this job proves the SHIPPED code runs on 3.9 even though the
    # proto round-trip tests skip themselves here.
    name: runtime floor (py3.9, no proto)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - run: python -m pip install --upgrade pip 'pytest>=7.0'
      - name: Every shipped module parses and imports on 3.9
        run: |
          python - <<'PY'
          import ast, glob, importlib, sys, pathlib
          files = sorted(glob.glob("scripts/**/*.py", recursive=True))
          assert files, "no shipped modules found"
          for f in files:
              ast.parse(pathlib.Path(f).read_text(), filename=f)
          sys.path.insert(0, "scripts")
          for mod in ("rius_cc.proto", "rius_cc.transcript", "rius_cc.spans",
                      "rius_cc.config", "rius_cc.state", "rius_cc.otlp",
                      "rius_cc.subagents", "exporter", "heartbeat", "hook",
                      "rius_ctl"):
              importlib.import_module(mod)
          print("%d modules parse and import on %s" % (len(files), sys.version.split()[0]))
          PY
      - name: Suite runs on the floor (proto-dependent tests skip)
        run: python -m pytest -q

  zero-runtime-deps:
    # A Claude Code plugin cannot ship a virtualenv, so shipped code may import
    # ONLY the standard library. This is a hard product constraint, not style.
    name: zero runtime dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python - <<'PY'
          import ast, glob, pathlib, sys
          stdlib = set(sys.stdlib_module_names)
          local = {"rius_cc", "proto", "transcript", "spans", "config", "state",
                   "otlp", "subagents", "log", "exporter", "heartbeat"}
          bad = []
          for f in sorted(glob.glob("scripts/**/*.py", recursive=True)):
              tree = ast.parse(pathlib.Path(f).read_text(), filename=f)
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      names = [a.name.split(".")[0] for a in node.names]
                  elif isinstance(node, ast.ImportFrom):
                      if node.level:            # relative import, local
                          continue
                      names = [(node.module or "").split(".")[0]]
                  else:
                      continue
                  for n in names:
                      if n and n not in stdlib and n not in local:
                          bad.append("%s:%d imports %r" % (f, node.lineno, n))
          if bad:
              print("Shipped code must import only the standard library:")
              print("\n".join("  " + b for b in bad))
              raise SystemExit(1)
          print("scripts/ imports only the standard library")
          PY

  plugin-manifests:
    name: plugin manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          import json, os, re, stat
          plugin = json.load(open(".claude-plugin/plugin.json"))
          market = json.load(open(".claude-plugin/marketplace.json"))
          hooks = json.load(open("hooks/hooks.json"))
          assert plugin["name"] == "rius", plugin["name"]
          names = [p["name"] for p in market["plugins"]]
          assert plugin["name"] in names, (plugin["name"], names)
          required = {"SessionStart", "UserPromptSubmit", "PreToolUse",
                      "PostToolUse", "Stop", "SessionEnd"}
          wired = set(hooks["hooks"])
          missing = required - wired
          assert not missing, "hook events not wired: %s" % sorted(missing)
          # Every command hooks.json names has to exist. A typo here is
          # invisible to the test suite AND to Claude Code, which runs the
          # command through a shell that exits without running anything.
          named = set()
          for groups in hooks["hooks"].values():
              for group in groups:
                  for entry in group["hooks"]:
                      for rel in re.findall(r"\$\{CLAUDE_PLUGIN_ROOT\}(/[\w./-]+)",
                                            entry["command"]):
                          named.add(rel.lstrip("/"))
          assert named, "no hook command names a file"
          for rel in sorted(named):
              assert os.path.exists(rel), "hooks.json runs a missing file: %s" % rel
          # scripts/_find_python.sh is sourced by hook.sh and rius_ctl.sh, not
          # named in hooks.json (it never appears as a ${CLAUDE_PLUGIN_ROOT}
          # command), so the loop above would never catch its absence. Check
          # it explicitly, or a missing file here silently degrades both
          # entry points into misreporting a PATH problem.
          assert os.path.exists("scripts/_find_python.sh"), \
              "scripts/_find_python.sh is missing (sourced by hook.sh/rius_ctl.sh)"
          # hook.py is deliberately NOT in this list: it carries no shebang
          # (see the comment at the top of it) and is only ever run as an
          # argument to an interpreter. rius_ctl.py keeps its shebang, so a
          # missing +x there is a real break the suite cannot see.
          mode = os.stat("scripts/rius_ctl.py").st_mode
          assert mode & stat.S_IXUSR, "scripts/rius_ctl.py is not executable"
          assert not open("scripts/hook.py").readline().startswith("#!"), \
              "hook.py has a shebang again: `py` will honour it and re-dispatch"
          print("manifests valid; %d hook events wired; %d commands on disk"
                % (len(wired), len(named)))
          PY

  secrets:
    name: no credentials committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan tracked files and full history for key-shaped strings
        run: |
          python - <<'PY'
          import re, subprocess, sys
          # Real Rius keys look like ri_<id>.<secret>; also catch the older
          # glassflow_ form and generic bearer-ish blobs.
          pat = re.compile(r"(ri_[A-Za-z0-9_\-]{16,}|glassflow_[A-Za-z0-9_\-]{16,}|sk-ant-[A-Za-z0-9_\-]{16,})")
          allow = re.compile(r"ri_x+|glassflow_\.\.\.|ri_\.\.\.|x{8,}")
          files = subprocess.run(["git", "ls-files"], capture_output=True, text=True).stdout.split()
          hits = []
          for f in files:
              try:
                  text = open(f, encoding="utf-8", errors="ignore").read()
              except OSError:
                  continue
              for m in pat.finditer(text):
                  if not allow.search(m.group(0)):
                      hits.append("%s: %s…" % (f, m.group(0)[:12]))
          if hits:
              print("Possible credentials in tracked files:")
              print("\n".join("  " + h for h in hits))
              raise SystemExit(1)
          print("no key-shaped strings in %d tracked files" % len(files))
          PY
