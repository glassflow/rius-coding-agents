[project]
name = "rius"
version = "0.6.2"
description = "Stream Claude Code, Codex and Cursor sessions to Rius as OpenTelemetry traces: prompts, model calls, tokens, cost, tool calls and subagents, per developer and per session"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7.0", "opentelemetry-proto==1.43.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
